<svg xmlns="http://www.w3.org/2000/svg" width="560" height="244" viewBox="0 0 560 244">
  <style>
    /* ── light ── */
    .bg { fill: #ffffff }
    .sp { fill: #3B7A57 }
    .ki { fill: #3B7A57 }
    .kt { fill: #ffffff; font: 700 8px system-ui,sans-serif }
    .hb { fill: #111827; font: 700 11px system-ui,sans-serif; letter-spacing: -0.3px }
    .hl { fill: #9ca3af; font: 500 9px 'SFMono-Regular',Consolas,monospace; letter-spacing: 1.5px }
    .dv { stroke: #f3f4f6; stroke-width: 1 }
    .t  { fill: #111827; font: 600 13px system-ui,sans-serif }
    .d  { fill: #b0b0b0; font: 400 11px system-ui,sans-serif }
    .dt { fill: #3B7A57; font: 600 10px 'SFMono-Regular',Consolas,monospace }
    /* ── dark ── */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117 }
      .sp { fill: #F0A8B8 }
      .hb { fill: #8b949e }
      .hl { fill: #6e7681 }
      .dv { stroke: #1c2128 }
      .t  { fill: #f0f6fc }
      .d  { fill: #6e7681 }
      .dt { fill: #F0A8B8 }
    }
  </style>

  <!-- background -->
  <rect class="bg" width="560" height="244" rx="6"/>

  <!-- accent top stripe (green → pink in dark) -->
  <rect class="sp" width="560" height="3" rx="3"/>

  <!-- K favicon icon — always green (brand mark) -->
  <rect class="ki" x="20"     y="13" width="12" height="12" rx="2.5"/>
  <text class="kt" x="26" y="22" text-anchor="middle">K</text>

  <!-- "Krong Dev." logo -->
  <text class="hb" x="36" y="22">Krong Dev.</text>

  <!-- "LATEST POSTS" label -->
  <text class="hl" x="120" y="22">· LATEST POSTS</text>

  <!-- header divider -->
  <line class="dv" x1="20" y1="36" x2="540" y2="36"/>

  <!-- posts -->
  
  
  <text class="t"  x="20"     y="64">Fedify #879 : KV 락 재시도를 스텁이 아닌 상태로 검증하기</text>
  <text class="d"  x="20"     y="82">Fedify의 @fedify/cfworkers가 Workers KV의 최종적 일관성 때문에 best-effort로만 순서를…</text>
  <text class="dt" x="540" y="64" text-anchor="end">10.04</text>
  <line class="dv" x1="20" y1="102" x2="540" y2="102"/>
  <text class="t"  x="20"     y="124">Fedify #951 : failure 벤치마크 Flaky Test와 가상 시계로 고치기</text>
  <text class="d"  x="20"     y="142">Fedify 벤치마크 failure 시나리오 테스트가 25ms duration과 CI 스케줄링 때문에 Flaky해지는 이유…</text>
  <text class="dt" x="540" y="124" text-anchor="end">09.29</text>
  <line class="dv" x1="20" y1="162" x2="540" y2="162"/>
  <text class="t"  x="20"     y="184">PR 알림과 CI 알림, GitHub에서 Discord로 나눠 보내기</text>
  <text class="d"  x="20"     y="202">GitHub PR 협업 이벤트와 CI 성공/실패 결과를 하나의 채널에 몰아넣지 않고, GitHub Webhook과 GitH…</text>
  <text class="dt" x="540" y="184" text-anchor="end">09.22</text>
</svg>